# ==================================================
# Application
# ==================================================
quarkus.application.name=invoice-ai-backend

# All REST endpoints under /api/*
quarkus.http.root-path=/api

# ==================================================
# Environment
# ==================================================
# Current environment (dev, test, prod)
app.env=${APP_ENV:dev}

# ==================================================
# HTTP / Server
# ==================================================
quarkus.http.port=8080

# ==================================================
# CORS Configuration
# ==================================================

# Allowed origins (frontend)
# Example: http://localhost:5173
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true

# ==================================================
# File Upload (PDF invoices)
# ==================================================
# Enable file uploads
quarkus.http.body.handle-file-uploads=true

# Temporary upload directory
quarkus.http.body.uploads-directory=uploads

# Max upload size (10 MB)
quarkus.http.limits.max-body-size=10M

# ==================================================
# AI Configuration (Groq / LLM)
# ==================================================
ai.provider=${AI_PROVIDER:groq}

# Model name (example: mixtral-8x7b-32768)
ai.model=${AI_MODEL:mixtral-8x7b-32768}

# API key (MUST come from env)
ai.api-key=${AI_API_KEY}

# ==================================================
# Logging
# ==================================================
# Default log level
quarkus.log.level=INFO

# Application packages log level
quarkus.log.category."com.antoniomarroffino".level=DEBUG

# ==================================================
# Dev mode tweaks
# ==================================================
%dev.quarkus.log.level=DEBUG
%dev.quarkus.http.access-log.enabled=true

# ==================================================
# Prod safety defaults
# ==================================================
%prod.quarkus.http.access-log.enabled=true
